name: Desktop Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set desktop build version
        shell: pwsh
        run: npm version "0.2.${{ github.run_number }}" --no-git-tag-version

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Build and publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibaocode-Windows-Installer
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
