name: Desktop Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set desktop build version
        shell: pwsh
        run: npm version "0.2.${{ github.run_number }}" --no-git-tag-version

      - name: Create release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$version" $env:GITHUB_SHA
          git push origin "v$version"

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never

      - name: Publish single GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          gh release create "v$version" `
            "dist/Vibaocode-Setup-$version.exe" `
            "dist/Vibaocode-Setup-$version.exe.blockmap" `
            "dist/latest.yml" `
            --verify-tag `
            --title "Vibaocode $version" `
            --notes "Vibaocode Desktop local-first for Windows. Includes local project runtime, memory/cache controls, and one-click updates."

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibaocode-Windows-Installer
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
